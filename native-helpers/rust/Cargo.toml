[package]
name = "narrant-rust-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
libc = "0.2"
tokio = { version = "1.53.1", features = ["process"] }
anyhow = "1.0"
tempfile = "3.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cargo_metadata = "0.23.1"
toml = "1.1.2"
url = "2.5"
crossbeam-channel = "0.5"
base-db = { git = "https://github.com/rust-lang/rust-analyzer.git", rev = "9074e9b4c6bc31d7986ccf4e22d18af70e5508da" }
hir-def = { git = "https://github.com/rust-lang/rust-analyzer.git", rev = "9074e9b4c6bc31d7986ccf4e22d18af70e5508da" }
ide = { git = "https://github.com/rust-lang/rust-analyzer.git", rev = "9074e9b4c6bc31d7986ccf4e22d18af70e5508da" }
load-cargo = { git = "https://github.com/rust-lang/rust-analyzer.git", rev = "9074e9b4c6bc31d7986ccf4e22d18af70e5508da" }
project-model = { git = "https://github.com/rust-lang/rust-analyzer.git", rev = "9074e9b4c6bc31d7986ccf4e22d18af70e5508da" }
syntax = { git = "https://github.com/rust-lang/rust-analyzer.git", rev = "9074e9b4c6bc31d7986ccf4e22d18af70e5508da" }
vfs = { git = "https://github.com/rust-lang/rust-analyzer.git", rev = "9074e9b4c6bc31d7986ccf4e22d18af70e5508da" }
ide-db = { git = "https://github.com/rust-lang/rust-analyzer.git", rev = "9074e9b4c6bc31d7986ccf4e22d18af70e5508da" }
toolchain = { git = "https://github.com/rust-lang/rust-analyzer.git", rev = "9074e9b4c6bc31d7986ccf4e22d18af70e5508da" }
vfs-notify = { git = "https://github.com/rust-lang/rust-analyzer.git", rev = "9074e9b4c6bc31d7986ccf4e22d18af70e5508da" }

[workspace]

[[bin]]
name = "narrant-rust"
path = "src/main.rs"

[[test]]
name = "lifecycle"
path = "src/tests/lifecycle.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_SystemServices"] }
