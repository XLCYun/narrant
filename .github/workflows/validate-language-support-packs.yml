name: Validate CodeGraph consumption

on:
  workflow_call:
    inputs:
      validation_scope:
        type: string
        default: full
      language:
        type: string
        default: all
      platform:
        type: string
        default: all
      upload_artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-lifecycle:
    if: inputs.validation_scope == 'windows-lifecycle'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Narrant shared process ownership tests
        run: node scripts/language-packs/run-windows-lifecycle-tests.mjs

  consumer:
    if: inputs.validation_scope != 'windows-lifecycle'
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.platform == 'windows' && '[{"target":"x86_64-pc-windows-msvc"}]' ||
            inputs.platform == 'macos' && '[{"target":"aarch64-apple-darwin"}]' ||
            '[{"target":"aarch64-apple-darwin"},{"target":"x86_64-pc-windows-msvc"}]'
          ) }}
    runs-on: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-15' || 'windows-2022' }}
    timeout-minutes: 120
    env:
      NARRANT_PROJECT_RUST_TOOLCHAIN: stable
      NARRANT_WINDOWS_TEST_MANIFEST: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      # 尚未发布时明确失败；不跳过、伪造 URL 或从 CodeGraph 源码重建 helper。
      - name: Download exact published CodeGraph seven-pack release
        run: node scripts/codegraph/download-packs.mjs codegraph-packs
      - name: Select isolated Rust project test Cargo home
        env:
          NARRANT_RUST_TEST_CARGO_HOME: ${{ runner.temp }}/narrant-codegraph-cargo
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'CARGO_HOME=' + process.env.NARRANT_RUST_TEST_CARGO_HOME + '\n')"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ runner.os }}-codegraph-consumer
      - name: Verify Windows process owner
        if: runner.os == 'Windows'
        run: node scripts/language-packs/run-windows-process-probe.mjs
      - name: Select isolated Windows SDK and MSVC declaration roots
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixed = (Get-Content resources/codegraph-test-sdks.json -Raw | ConvertFrom-Json).runner_prerequisites.'x86_64-pc-windows-msvc'
          $version = $fixed.msvc_tools
          # 发现含固定工具集的 VS 2022 实例，兼容已安装的 Build Tools。
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'Visual Studio Installer vswhere.exe is missing' }
          # 先等待原生命令完整退出，避免 First 提前终止管道而留下空退出码。
          $installations = @(& $vswhere -products '*' -version '[17.0,18.0)' -property installationPath)
          if ($LASTEXITCODE -ne 0) { throw "VS 2022 discovery failed with exit code $LASTEXITCODE" }
          $vs = $installations |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ "VC\Tools\MSVC\$version\include") -PathType Container } |
            Select-Object -First 1
          if (!$vs) { throw "No VS 2022 instance contains MSVC $version" }
          $msvc = "$vs\VC\Tools\MSVC\$version"
          $sdk = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Include\$($fixed.windows_sdk)"
          foreach ($directory in @("$msvc\include", "$sdk\ucrt", "$sdk\um", "$sdk\shared")) {
            if (!(Test-Path $directory -PathType Container)) { throw "Missing exact SDK directory: $directory" }
          }
          "NARRANT_MSVC_ROOT=$msvc" >> $env:GITHUB_ENV
          "NARRANT_MSVC_VERSION=$version" >> $env:GITHUB_ENV
          "NARRANT_WINDOWS_SDK=$sdk" >> $env:GITHUB_ENV
          "NARRANT_WINDOWS_SDK_VERSION=$($fixed.windows_sdk)" >> $env:GITHUB_ENV
          "NARRANT_VISUAL_STUDIO=$vs" >> $env:GITHUB_ENV
      - name: Select macOS target project SDK
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Prepare analyzed-project SDK fixtures
        run: node scripts/language-packs/prepare-test-sdks.mjs "${{ runner.temp }}/narrant-codegraph-test-sdks" --language "${{ inputs.language || 'all' }}"
      - name: Prepare Rust project standard declarations
        if: inputs.language == 'all' || inputs.language == 'rust'
        run: rustup component add rust-src --toolchain stable
      - name: Prepare offline standard-library fixture metadata
        if: inputs.language == 'all' || inputs.language == 'rust'
        run: node scripts/language-packs/prepare-rust-native-tests.mjs --prepare
      - name: Verify installed public CLI, all graph differences, and Review DTO lifecycle
        run: node scripts/codegraph/verify-consumer.mjs codegraph-packs --language "${{ inputs.language || 'all' }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && inputs.upload_artifacts
        with:
          retention-days: 7
          name: codegraph-consumer-${{ matrix.target }}
          path: |
            codegraph-packs/*/*/*/manifest.json
            codegraph-packs/candidates.json
          if-no-files-found: error
