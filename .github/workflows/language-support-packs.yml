name: Language support packs

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Full acceptance, native analyzers, or Windows lifecycle
        type: choice
        options: [full, native-analyzers, windows-lifecycle]
        default: full
      language:
        description: Completed Native helper to validate (all keeps the full language gate)
        type: choice
        options: [all, typescript-javascript, rust, python, java, go, csharp, c-cpp]
        default: all
      platform:
        description: Platforms to validate (publishing requires all)
        type: choice
        options: [all, macos, windows]
        default: all
      upload_artifacts:
        description: Upload build artifacts (always enabled when publishing)
        type: boolean
        default: true
      publish:
        description: Publish validated packs as GitHub Releases (never application Latest)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate-language-support-packs.yml
    with:
      validation_scope: ${{ inputs.validation_scope }}
      language: ${{ inputs.language }}
      platform: ${{ inputs.platform }}
      upload_artifacts: ${{ inputs.upload_artifacts || inputs.publish }}

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' && inputs.language == 'all' && inputs.platform == 'all' && inputs.publish && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: macos-15
    timeout-minutes: 20
    environment: language-support-packs
    concurrency:
      group: language-support-packs-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: language-support-packs-*
          merge-multiple: true
          path: language-support-packs
      - name: Validate complete artifacts before obtaining credentials
        run: node --input-type=module -e "import { readArtifacts } from './scripts/publish-language-support-packs.mjs'; await readArtifacts('language-support-packs')"
      - name: Publish immutable artifacts and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-language-support-packs.mjs language-support-packs
