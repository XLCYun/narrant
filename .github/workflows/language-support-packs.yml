name: Language support packs

on:
  pull_request:
    paths:
      - resources/language-support-packs.json
      - resources/native-toolchains.json
      - scripts/provision-native-toolchains.mjs
      - scripts/select-msvc-redist.mjs
      - scripts/tests/select-msvc-redist.test.mjs
      - scripts/native-xz-extraction.mjs
      - scripts/tests/native-xz-extraction.test.mjs
      - scripts/verify-native-analyzers.mjs
      - scripts/prepare-rust-native-tests.mjs
      - scripts/run-rust-helper-test.mjs
      - scripts/native-migration.mjs
      - scripts/build-migrating-native-helper.mjs
      - scripts/tests/native-analyzer-ci.test.mjs
      - scripts/run-windows-process-probe.mjs
      - scripts/tests/run-windows-process-probe.test.mjs
      - scripts/run-windows-lifecycle-tests.mjs
      - scripts/verify-windows-runner.mjs
      - scripts/verify-macos-runner.mjs
      - scripts/cargo-agent.sh
      - scripts/tests/run-windows-lifecycle-tests.test.mjs
      - src-tauri/tests/native_helper_graphs.rs
      - scripts/*language-support-packs.mjs
      - scripts/tests/language-support-packs.test.mjs
      - scripts/archive-validation.mjs
      - scripts/typescript-native-smoke.mjs
      - scripts/tests/archive-validation.test.mjs
      - scripts/verify-python-analyzer.mjs
      - native-helpers/**
      - scripts/native-language-support-packs.mjs
      - scripts/tests/native-language-support-packs.test.mjs
      - src-tauri/src/structure_review/code_graph/**
      - src-tauri/src/structure_review/native_analyzer/**
      - src-tauri/src/structure_review/native_languages/**
      - src-tauri/src/structure_review/application/**
      - src-tauri/src/language_support/**
      - src-tauri/src/child_process.rs
      - src-tauri/src/child_process/**
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/build.rs
      - .github/workflows/language-support-packs.yml
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Full acceptance, native analyzers, Windows lifecycle, or macOS runner setup check
        type: choice
        options: [full, native-analyzers, windows-lifecycle, macos-runner]
        default: full
      language:
        description: Completed Native helper to validate (all keeps the full language gate)
        type: choice
        options: [all, typescript-javascript, rust, python, java, go, csharp, c-cpp]
        default: all
      platform:
        description: Platforms to validate (publishing requires all)
        type: choice
        options: [all, macos, windows]
        default: all
      upload_artifacts:
        description: Upload build artifacts (always enabled when publishing)
        type: boolean
        default: true
      publish:
        description: Publish validated packs to the immutable OSS prefix
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-runner:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'macos-runner'
    runs-on: ${{ fromJSON(vars.NARRANT_MACOS_RUNNER_LABELS || '["self-hosted","macOS","ARM64","narrant-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate runner routing and Cargo integration
        run: node --test scripts/tests/run-windows-lifecycle-tests.test.mjs scripts/tests/rust-cache.test.mjs
      - name: Verify the macOS service account, SDK and bounded cache
        run: node scripts/verify-macos-runner.mjs --smoke

  windows-lifecycle:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'windows-lifecycle'
    # 缺少仓库变量时仍使用自托管标签，避免产生托管执行费用。
    runs-on: ${{ fromJSON(vars.NARRANT_WINDOWS_RUNNER_LABELS || '["self-hosted","Windows","X64","narrant-ci"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Verify Windows runner filesystem prerequisites
        run: node scripts/verify-windows-runner.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate lifecycle runner
        run: node --test scripts/tests/run-windows-lifecycle-tests.test.mjs
      - name: Run process and Native Helper lifecycle checks from production sources
        run: node scripts/run-windows-lifecycle-tests.mjs

  build:
    if: github.event_name != 'workflow_dispatch' || (inputs.validation_scope == 'full' && inputs.language == 'all')
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.platform == 'windows' && '[{"target":"x86_64-pc-windows-msvc"}]' ||
            inputs.platform == 'macos' && '[{"target":"aarch64-apple-darwin"}]' ||
            '[{"target":"aarch64-apple-darwin"},{"target":"x86_64-pc-windows-msvc"}]'
          ) }}
    runs-on: ${{ fromJSON(matrix.target == 'aarch64-apple-darwin' && (vars.NARRANT_MACOS_RUNNER_LABELS || '["self-hosted","macOS","ARM64","narrant-ci"]') || (vars.NARRANT_WINDOWS_RUNNER_LABELS || '["self-hosted","Windows","X64","narrant-ci"]')) }}
    # Windows 冷构建包含 release 打包、helper 测试与 Host 编译，使用完整验收的总预算。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Verify Windows runner filesystem prerequisites
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-runner.mjs
      - name: Verify self-hosted macOS runner prerequisites
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: node scripts/verify-macos-runner.mjs
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/tests/archive-validation.test.mjs scripts/tests/language-support-packs.test.mjs scripts/tests/native-language-support-packs.test.mjs
      # 锁定 Ruff 源码包含超过 MAX_PATH 的快照；Cargo 的 libgit2 checkout 读取此配置。
      - name: Enable Windows Git checkout long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Prepare pinned Rust helper build toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build and execute native tools
        run: node scripts/build-language-support-packs.mjs --target ${{ matrix.target }} --native --output language-support-packs
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native Python graphs, installation, and Review lifecycle
        run: node scripts/verify-python-analyzer.mjs language-support-packs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # 仅手动验收可不占用产物存储，正式发布仍依赖上传成功。
        if: github.event_name != 'workflow_dispatch' || inputs.upload_artifacts || inputs.publish
        with:
          name: language-support-packs-${{ matrix.target }}
          path: language-support-packs/
          if-no-files-found: error

  native-analyzers:
    if: github.event_name != 'workflow_dispatch' || (inputs.validation_scope != 'windows-lifecycle' && inputs.validation_scope != 'macos-runner')
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.platform == 'windows' && '[{"target":"x86_64-pc-windows-msvc"}]' ||
            inputs.platform == 'macos' && '[{"target":"aarch64-apple-darwin"}]' ||
            '[{"target":"aarch64-apple-darwin"},{"target":"x86_64-pc-windows-msvc"}]'
          ) }}
    runs-on: ${{ fromJSON(matrix.target == 'aarch64-apple-darwin' && (vars.NARRANT_MACOS_RUNNER_LABELS || '["self-hosted","macOS","ARM64","narrant-ci"]') || (vars.NARRANT_WINDOWS_RUNNER_LABELS || '["self-hosted","Windows","X64","narrant-ci"]')) }}
    # 自托管 Windows 串行冷编译七套 helper 与 Host，再运行全部测试，需要超过两小时。
    timeout-minutes: 180
    env:
      # 测试项目选择独立于 helper 的固定构建版本，缓存必须由本次 setup 显式准备。
      NARRANT_PROJECT_RUST_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Verify Windows runner filesystem prerequisites
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-runner.mjs
      - name: Verify self-hosted macOS runner prerequisites
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: node scripts/verify-macos-runner.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Probe Windows process cleanup before toolchain provisioning
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/run-windows-process-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows process cleanup probe failed; see job membership and process handle evidence above' }
      - run: pnpm install --frozen-lockfile
      - name: Test native validation and pack scripts
        run: node --test scripts/tests/archive-validation.test.mjs scripts/tests/native-analyzer-ci.test.mjs scripts/tests/run-windows-process-probe.test.mjs scripts/tests/run-windows-lifecycle-tests.test.mjs scripts/tests/native-language-support-packs.test.mjs scripts/tests/native-xz-extraction.test.mjs scripts/tests/select-msvc-redist.test.mjs
      # 只准备 CI 工具源码 checkout；保持独立 Cargo home 和用户项目离线分析策略。
      - name: Enable Windows Git checkout long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Select isolated Windows SDK and MSVC declaration roots
        if: runner.os == 'Windows' && (inputs.language == '' || inputs.language == 'all' || inputs.language == 'c-cpp')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixed = (Get-Content resources/native-toolchains.json -Raw | ConvertFrom-Json).runner_prerequisites.'x86_64-pc-windows-msvc'
          $version = $fixed.msvc_tools
          # 发现含固定工具集的 VS 2022 实例，同时支持托管镜像和自托管 Build Tools。
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'Visual Studio Installer vswhere.exe is missing' }
          # 先等待原生命令完整退出，避免 First 提前终止管道而留下空退出码。
          $installations = @(& $vswhere -products '*' -version '[17.0,18.0)' -property installationPath)
          if ($LASTEXITCODE -ne 0) { throw "VS 2022 discovery failed with exit code $LASTEXITCODE" }
          $vs = $installations |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ "VC\Tools\MSVC\$version\include") -PathType Container } |
            Select-Object -First 1
          if (!$vs) { throw "No VS 2022 instance contains MSVC $version" }
          $msvc = "$vs\VC\Tools\MSVC\$version"
          $sdk = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Include\$($fixed.windows_sdk)"
          foreach ($directory in @("$msvc\include", "$sdk\ucrt", "$sdk\um", "$sdk\shared")) {
            if (!(Test-Path $directory -PathType Container)) { throw "Missing exact SDK directory: $directory" }
          }
          node scripts/select-msvc-redist.mjs "$vs" "$($fixed.msvc_runtime_version)"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed MSVC runtime selection failed; see metadata and DLL version evidence above' }
          "NARRANT_MSVC_ROOT=$msvc" >> $env:GITHUB_ENV
          "NARRANT_MSVC_VERSION=$version" >> $env:GITHUB_ENV
          "NARRANT_WINDOWS_SDK=$sdk" >> $env:GITHUB_ENV
          "NARRANT_WINDOWS_SDK_VERSION=$($fixed.windows_sdk)" >> $env:GITHUB_ENV
          "NARRANT_VISUAL_STUDIO=$vs" >> $env:GITHUB_ENV
      - name: Provision checksum-verified private developer toolchains
        run: node scripts/provision-native-toolchains.mjs "${{ runner.temp }}/narrant-native-toolchains" --language "${{ inputs.language || 'all' }}"
      - name: Select isolated Rust project test Cargo home
        env:
          NARRANT_RUST_TEST_CARGO_HOME: ${{ runner.temp }}/narrant-native-cargo
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'CARGO_HOME=' + process.env.NARRANT_RUST_TEST_CARGO_HOME + '\n')"
      - name: Prepare pinned Rust helper build toolchain
        if: inputs.language == 'all' || inputs.language == 'rust' || inputs.language == 'python' || github.event_name != 'workflow_dispatch'
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Prepare Rust project sources and historical Cargo test inputs
        if: inputs.language == 'all' || inputs.language == 'rust' || github.event_name != 'workflow_dispatch'
        run: |
          rustup component add rust-src --toolchain stable
          rustup toolchain install 1.81.0 1.94.0 1.96.0 --profile minimal
          node scripts/prepare-rust-native-tests.mjs --prepare
      - name: Build packs, run helper suites, Host lifecycle and public graph/diff conformance
        run: node scripts/verify-native-analyzers.mjs native-language-support-packs --build --language "${{ inputs.language || 'all' }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.upload_artifacts || inputs.publish)
        with:
          name: native-analyzers-${{ matrix.target }}
          path: |
            native-language-support-packs/*/*/*/manifest.json
            native-language-support-packs/*/*/*/pack.tar.gz
            native-language-support-packs/native-helpers-config.json
          if-no-files-found: warn

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' && inputs.language == 'all' && inputs.platform == 'all' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, native-analyzers]
    runs-on: ${{ fromJSON(vars.NARRANT_MACOS_RUNNER_LABELS || '["self-hosted","macOS","ARM64","narrant-ci"]') }}
    timeout-minutes: 20
    environment: language-support-packs
    concurrency:
      group: language-support-packs-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: language-support-packs-*
          merge-multiple: true
          path: language-support-packs
      - name: Validate complete artifacts before obtaining credentials
        run: node --input-type=module -e "import { readArtifacts } from './scripts/publish-language-support-packs.mjs'; await readArtifacts('language-support-packs')"
      - name: Install checksum-verified ossutil 1.7.19 for Apple Silicon
        run: bash scripts/install-ci-ossutil.sh
      - name: Exchange isolated OSS publishing identity
        id: oss
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIBABA_CLOUD_ROLE_ARN }}
          role-session-name: narrant-packs-${{ github.run_id }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com
      - name: Publish immutable artifacts and verify public downloads
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ steps.oss.outputs.aliyun-access-key-id }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ steps.oss.outputs.aliyun-access-key-secret }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ steps.oss.outputs.aliyun-security-token }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
        run: node scripts/publish-language-support-packs.mjs language-support-packs
