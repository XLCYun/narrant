name: Native application update smoke evidence

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Private source stable tag (normal mode)
        required: false
        type: string
      source_sha:
        description: Exact 40-character private source commit
        required: true
        type: string
      public_release_id:
        description: Fixed cyunlab/narrant Draft Release database ID (normal mode)
        required: false
        type: string
      public_tag:
        description: Public artifact Release tag (normal mode)
        required: false
        type: string
      mode:
        description: Isolated previous-Stable upgrade with separate production artifact checks
        required: true
        type: choice
        options: [normal, preflight]
      previous_stable_tag:
        description: Required in normal mode
        required: false
        type: string
      previous_stable_manifest_sha256:
        description: Required lowercase SHA-256 in normal mode
        required: false
        type: string
      preflight_target:
        description: Branch-only target; macOS upgrade acceptance is currently paused
        required: true
        default: windows
        type: choice
        options: [windows, macos, both]
      preflight_baseline:
        description: Candidate compares two test versions of fixed source, not previous Stable
        required: true
        default: previous-stable
        type: choice
        options: [previous-stable, candidate]
  workflow_call:
    inputs:
      source_tag: { required: true, type: string }
      source_sha: { required: true, type: string }
      public_release_id: { required: true, type: string }
      public_tag: { required: true, type: string }
      mode: { required: true, type: string }
      previous_stable_tag: { required: false, type: string }
      previous_stable_manifest_sha256: { required: false, type: string }
      preflight_target: { required: false, type: string, default: windows }
      preflight_baseline: { required: false, type: string, default: previous-stable }
    secrets:
      CYUNLAB_RELEASE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: narrant-update-smoke-${{ inputs.public_release_id || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.mode == 'preflight'
    name: Isolated branch upgrade (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.preflight_target == 'both' && '[{"runner":"macos","target":"darwin-aarch64"},{"runner":"windows","target":"windows-x86_64"}]' || inputs.preflight_target == 'macos' && '[{"runner":"macos","target":"darwin-aarch64"}]' || '[{"runner":"windows","target":"windows-x86_64"}]') }}
    runs-on: ${{ fromJSON(matrix.runner == 'macos' && (vars.NARRANT_MACOS_RUNNER_LABELS || '["self-hosted","macOS","ARM64","narrant-ci"]') || (vars.NARRANT_WINDOWS_RUNNER_LABELS || '["self-hosted","Windows","X64","narrant-ci"]')) }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify exact branch source and existing desktop
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREVIOUS_TAG: ${{ inputs.previous_stable_tag }}
          PREFLIGHT_TARGET: ${{ inputs.preflight_target }}
          BASELINE_SOURCE: ${{ inputs.preflight_baseline }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          [[ "$PREFLIGHT_TARGET" =~ ^(windows|macos|both)$ ]]
          [[ "$BASELINE_SOURCE" =~ ^(previous-stable|candidate)$ ]]
          [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "refs/tags/${PREVIOUS_TAG}^{}" "$SOURCE_SHA"
          node scripts/verify-desktop-runner.mjs --isolated-update-test
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - name: Build two isolated test packages
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREVIOUS_TAG: ${{ inputs.previous_stable_tag }}
          BASELINE_SOURCE: ${{ inputs.preflight_baseline }}
        run: |
          set -euo pipefail
          baseline_sha="$(git rev-parse "refs/tags/${PREVIOUS_TAG}^{}")"
          baseline_version="${PREVIOUS_TAG#v}"
          if [ "$BASELINE_SOURCE" = candidate ]; then
            baseline_sha="$SOURCE_SHA"
            baseline_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          export BASELINE_VERSION="$baseline_version"
          candidate_version="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const base = process.env.BASELINE_VERSION.split(".").map(Number);
            const source = JSON.parse(readFileSync("src-tauri/tauri.conf.json")).version.split(".").map(Number);
            const differing = source.findIndex((part, index) => part !== base[index]);
            if (differing >= 0 && source[differing] < base[differing]) throw new Error("Candidate is older than baseline");
            console.log(differing < 0 ? [base[0], base[1], base[2] + 1].join(".") : source.join("."));
          ')"
          pnpm test:upgrade:build "$baseline_sha" "$baseline_version" \
            "$SOURCE_SHA" "$candidate_version" update-test-builds
      - name: Exercise real upgrade and data preservation without production artifacts
        run: pnpm test:upgrade:run update-test-builds/test-builds.json update-test-observation
      - name: Preserve preflight evidence and build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: narrant-update-preflight-${{ inputs.source_sha }}-${{ matrix.target }}
          path: |
            update-test-builds/test-builds.json
            update-test-builds/*-overlay.patch
            update-test-builds/*-build.log
            update-test-observation/isolated-test.json
          if-no-files-found: warn
          retention-days: 14

  isolated-upgrade:
    if: inputs.mode != 'preflight'
    name: Isolated update smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos
            target: darwin-aarch64
            expected_os: darwin
            expected_arch: arm64
          - runner: windows
            target: windows-x86_64
            expected_os: win32
            expected_arch: x64
    runs-on: ${{ fromJSON(matrix.runner == 'macos' && (vars.NARRANT_MACOS_RUNNER_LABELS || '["self-hosted","macOS","ARM64","narrant-ci"]') || (vars.NARRANT_WINDOWS_RUNNER_LABELS || '["self-hosted","Windows","X64","narrant-ci"]')) }}
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate trusted source identity and runner target
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLIC_TAG: ${{ inputs.public_tag }}
          MODE: ${{ inputs.mode }}
          PREVIOUS_TAG: ${{ inputs.previous_stable_tag }}
          PREVIOUS_MANIFEST_SHA256: ${{ inputs.previous_stable_manifest_sha256 }}
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUBLIC_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
          test "$(git rev-parse "refs/tags/${SOURCE_TAG}^{}")" = "$SOURCE_SHA"
          node -e "if (process.platform !== process.env.EXPECTED_OS || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)"
          test "$MODE" = normal
          [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PREVIOUS_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git merge-base --is-ancestor "refs/tags/${PREVIOUS_TAG}^{}" "$SOURCE_SHA"
      - name: Verify existing desktop and isolated update prerequisites
        run: node scripts/verify-desktop-runner.mjs --isolated-update-test
      - name: Ensure stable Rust is available
        run: rustup toolchain install stable --profile minimal
      - name: Install exact locked script dependencies
        run: pnpm install --frozen-lockfile
      - name: Download and byte-verify the fixed public Draft
        shell: bash
        env:
          CYUNLAB_RELEASE_TOKEN: ${{ secrets.CYUNLAB_RELEASE_TOKEN }}
          NARRANT_UPDATER_PUBLIC_KEY: ${{ vars.NARRANT_UPDATER_PUBLIC_KEY }}
          NARRANT_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.NARRANT_RELEASE_SIGNING_PUBLIC_KEY }}
          NARRANT_UPDATER_BRIDGE_TAG: ${{ vars.NARRANT_UPDATER_BRIDGE_TAG }}
          NARRANT_UPDATE_MODE: ${{ inputs.mode }}
          PUBLIC_RELEASE_ID: ${{ inputs.public_release_id }}
          PUBLIC_TAG: ${{ inputs.public_tag }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          version="${SOURCE_TAG#v}"
          node scripts/public-draft-assets.mjs \
            "$PUBLIC_RELEASE_ID" "$PUBLIC_TAG" "$version" \
            candidate-assets candidate-draft-receipt.json
      - name: Prepare exact published previous Stable baseline
        if: inputs.mode == 'normal'
        shell: bash
        env:
          NARRANT_PREVIOUS_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.NARRANT_PREVIOUS_RELEASE_SIGNING_PUBLIC_KEY }}
          TARGET: ${{ matrix.target }}
          PREVIOUS_TAG: ${{ inputs.previous_stable_tag }}
        run: |
          set -euo pipefail
          node scripts/prepare-update-smoke-assets.mjs "$TARGET" "$PREVIOUS_TAG" previous-assets
          test "$(node -p "require('./previous-assets/previous.json').manifestSha256")" = \
            "${{ inputs.previous_stable_manifest_sha256 }}"
      - name: Build separately identified old and candidate test packages
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
          PREVIOUS_TAG: ${{ inputs.previous_stable_tag }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          pnpm test:upgrade:build "$(git rev-parse "refs/tags/${PREVIOUS_TAG}^{}")" "${PREVIOUS_TAG#v}" \
            "$SOURCE_SHA" "${SOURCE_TAG#v}" update-test-builds
      - name: Verify production artifacts and run isolated native lifecycle
        shell: bash
        env:
          NARRANT_UPDATER_PUBLIC_KEY: ${{ vars.NARRANT_UPDATER_PUBLIC_KEY }}
          NARRANT_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.NARRANT_RELEASE_SIGNING_PUBLIC_KEY }}
          NARRANT_PREVIOUS_RELEASE_SIGNING_PUBLIC_KEY: ${{ inputs.mode == 'normal' && vars.NARRANT_PREVIOUS_RELEASE_SIGNING_PUBLIC_KEY || '' }}
          NARRANT_UPDATER_BRIDGE_TAG: ${{ vars.NARRANT_UPDATER_BRIDGE_TAG }}
          PREVIOUS_TAG: ${{ inputs.previous_stable_tag }}
          TARGET: ${{ matrix.target }}
          MODE: ${{ inputs.mode }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLIC_RELEASE_ID: ${{ inputs.public_release_id }}
          PUBLIC_TAG: ${{ inputs.public_tag }}
        run: |
          set -euo pipefail
          version="${SOURCE_TAG#v}"
          if [[ "$TARGET" == darwin-aarch64 ]]; then
            installer="candidate-assets/Narrant_${version}_aarch64.dmg"
          else
            installer="candidate-assets/Narrant_${version}_x64-setup.exe"
          fi
          args=(
            --target "$TARGET"
            --mode "$MODE"
            --source-tag "$SOURCE_TAG"
            --source-sha "$SOURCE_SHA"
            --public-release-id "$PUBLIC_RELEASE_ID"
            --public-tag "$PUBLIC_TAG"
            --version "$version"
            --draft-receipt candidate-draft-receipt.json
            --candidate-directory candidate-assets
            --candidate-installer "$installer"
            --test-build-receipt update-test-builds/test-builds.json
            --test-output-directory update-test-observation
            --previous-source-sha "$(git rev-parse "refs/tags/${PREVIOUS_TAG}^{}")"
            --output-directory smoke-evidence
          )
          if [[ "$MODE" == normal ]]; then
            args+=(--previous-json previous-assets/previous.json)
          fi
          node scripts/run-native-update-smoke.mjs "${args[@]}"
      - name: Upload checksummed target evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: narrant-update-smoke-${{ inputs.public_tag }}-${{ inputs.source_sha }}-${{ matrix.target }}
          path: smoke-evidence/*
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Verify exact two-target evidence
    needs: isolated-upgrade
    runs-on: ${{ fromJSON(vars.NARRANT_MACOS_RUNNER_LABELS || '["self-hosted","macOS","ARM64","narrant-ci"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: narrant-update-smoke-${{ inputs.public_tag }}-${{ inputs.source_sha }}-*
          path: smoke-evidence
          merge-multiple: true
      - name: Re-download Draft and verify exact evidence aggregation
        shell: bash
        env:
          CYUNLAB_RELEASE_TOKEN: ${{ secrets.CYUNLAB_RELEASE_TOKEN }}
          NARRANT_UPDATER_PUBLIC_KEY: ${{ vars.NARRANT_UPDATER_PUBLIC_KEY }}
          NARRANT_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.NARRANT_RELEASE_SIGNING_PUBLIC_KEY }}
          NARRANT_PREVIOUS_RELEASE_SIGNING_PUBLIC_KEY: ${{ inputs.mode == 'normal' && vars.NARRANT_PREVIOUS_RELEASE_SIGNING_PUBLIC_KEY || '' }}
          NARRANT_UPDATER_BRIDGE_TAG: ${{ vars.NARRANT_UPDATER_BRIDGE_TAG }}
          NARRANT_UPDATE_MODE: ${{ inputs.mode }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLIC_RELEASE_ID: ${{ inputs.public_release_id }}
          PUBLIC_TAG: ${{ inputs.public_tag }}
          MODE: ${{ inputs.mode }}
          PREVIOUS_TAG: ${{ inputs.previous_stable_tag }}
          PREVIOUS_MANIFEST_SHA256: ${{ inputs.previous_stable_manifest_sha256 }}
        run: |
          set -euo pipefail
          version="${SOURCE_TAG#v}"
          node scripts/public-draft-assets.mjs \
            "$PUBLIC_RELEASE_ID" "$PUBLIC_TAG" "$version" \
            aggregate-draft aggregate-draft-receipt.json
          manifest_sha="$(node -p "require('./aggregate-draft-receipt.json').manifestSha256")"
          args=(
            --evidence smoke-evidence
            --mode "$MODE"
            --source-tag "$SOURCE_TAG"
            --source-sha "$SOURCE_SHA"
            --public-release-id "$PUBLIC_RELEASE_ID"
            --public-tag "$PUBLIC_TAG"
            --version "$version"
            --manifest-sha256 "$manifest_sha"
            --draft-receipt aggregate-draft-receipt.json
            --max-age-hours 24
          )
          args+=(--previous-tag "$PREVIOUS_TAG" --previous-manifest-sha256 "$PREVIOUS_MANIFEST_SHA256")
          node scripts/update-smoke-evidence.mjs "${args[@]}"
      - name: Upload verified aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: narrant-update-smoke-${{ inputs.public_tag }}-${{ inputs.source_sha }}
          path: smoke-evidence/*
          if-no-files-found: error
          retention-days: 30
