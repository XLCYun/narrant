name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 校验稳定版本标签与版本声明
        id: version
        env:
          NARRANT_GITHUB_CLIENT_ID: ${{ vars.NARRANT_GITHUB_CLIENT_ID }}
          NARRANT_GITHUB_APP_SLUG: ${{ vars.NARRANT_GITHUB_APP_SLUG }}
        shell: bash
        run: |
          set -euo pipefail
          : "${NARRANT_GITHUB_CLIENT_ID:?缺少 Actions Variable NARRANT_GITHUB_CLIENT_ID}"
          : "${NARRANT_GITHUB_APP_SLUG:?缺少 Actions Variable NARRANT_GITHUB_APP_SLUG}"
          version="$(node scripts/release/release-version-check.mjs "$GITHUB_REF_NAME")"
          source_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{}")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  quality-gate:
    needs: validate
    uses: ./.github/workflows/quality-gate.yml

  macos:
    needs: [validate, quality-gate]
    runs-on: macos-15
    timeout-minutes: 180
    env:
      NARRANT_GITHUB_CLIENT_ID: ${{ vars.NARRANT_GITHUB_CLIENT_ID }}
      NARRANT_GITHUB_APP_SLUG: ${{ vars.NARRANT_GITHUB_APP_SLUG }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      NARRANT_UPDATER_ENDPOINT: https://github.com/XLCYun/narrant/releases/latest/download/latest.json
      NARRANT_UPDATER_PUBLIC_KEY: ${{ vars.NARRANT_UPDATER_PUBLIC_KEY }}
      NARRANT_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.NARRANT_RELEASE_SIGNING_PUBLIC_KEY }}
      NARRANT_UPDATER_BRIDGE_TAG: ${{ vars.NARRANT_UPDATER_BRIDGE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 在构建前校验 updater trust 配置
        shell: bash
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?缺少 TAURI_SIGNING_PRIVATE_KEY}"
          : "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:?缺少 TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          : "${NARRANT_UPDATER_PUBLIC_KEY:?缺少 NARRANT_UPDATER_PUBLIC_KEY}"
          : "${NARRANT_RELEASE_SIGNING_PUBLIC_KEY:?缺少 NARRANT_RELEASE_SIGNING_PUBLIC_KEY}"
          if [[ "$NARRANT_RELEASE_SIGNING_PUBLIC_KEY" != "$NARRANT_UPDATER_PUBLIC_KEY" ]]; then
            test "$NARRANT_UPDATER_BRIDGE_TAG" = "$GITHUB_REF_NAME"
          fi
          [[ "$NARRANT_UPDATER_ENDPOINT" == "https://github.com/XLCYun/narrant/releases/latest/download/latest.json" ]] || {
            echo "NARRANT_UPDATER_ENDPOINT 必须是固定公开 Stable manifest。" >&2
            exit 1
          }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ runner.os }}-native
      - run: pnpm install --frozen-lockfile
      - name: 导入 Developer ID 证书和公证密钥
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/narrant-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | openssl base64 -d -A -out "$api_key"
          chmod 600 "$certificate" "$api_key"

          security list-keychains -d user > "$RUNNER_TEMP/narrant-signing-keychains.txt"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_API_KEY_PATH=$api_key" >> "$GITHUB_ENV"
      - name: 构建、递归签名并公证最终 macOS app
        shell: bash
        run: |
          set -euo pipefail
          env -u APPLE_API_ISSUER -u APPLE_API_KEY -u APPLE_API_KEY_PATH \
            pnpm tauri build --target aarch64-apple-darwin --bundles app --verbose

          shopt -s nullglob
          apps=(src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)
          [[ ${#apps[@]} -eq 1 ]] || {
            echo "期望一个 Apple Silicon app，实际找到 ${#apps[@]} 个。" >&2
            exit 1
          }
          app_path="${apps[0]}"
          while IFS= read -r -d '' candidate; do
            if file -b "$candidate" | grep -q 'Mach-O'; then
              codesign --force \
                --sign "$APPLE_SIGNING_IDENTITY" \
                --options runtime \
                --timestamp \
                "$candidate"
            fi
          done < <(find "$app_path/Contents" -type f -print0)
          codesign --force \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --timestamp \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          notary_zip="$RUNNER_TEMP/narrant-app-notary.zip"
          ditto -c -k --keepParent "$app_path" "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --key "$APPLE_API_KEY_PATH" \
            --wait
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          app_directory="$(dirname "$app_path")"
          updater_archives=("$app_directory"/*.app.tar.gz)
          [[ ${#updater_archives[@]} -eq 1 ]] || {
            echo "期望一个 macOS updater archive，实际找到 ${#updater_archives[@]} 个。" >&2
            exit 1
          }
          updater_archive="${updater_archives[0]}"
          rm -f "$updater_archive" "$updater_archive.sig"
          tar -czf "$updater_archive" -C "$app_directory" "$(basename "$app_path")"
          pnpm tauri signer sign "$updater_archive"
          test -s "$updater_archive.sig"

          dmg_directory="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          dmg_path="$dmg_directory/Narrant_${{ needs.validate.outputs.version }}_aarch64.dmg"
          mkdir -p "$dmg_directory"
          dmg_staging="$(mktemp -d "$RUNNER_TEMP/narrant-dmg-root.XXXXXX")"
          ditto "$app_path" "$dmg_staging/Narrant.app"
          ln -s /Applications "$dmg_staging/Applications"
          test -d "$dmg_staging/Narrant.app"
          [[ "$(readlink "$dmg_staging/Applications")" == "/Applications" ]]
          hdiutil create -volname Narrant -srcfolder "$dmg_staging" -ov -format UDZO "$dmg_path"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg_path"
          codesign --verify --strict --verbose=2 "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --key "$APPLE_API_KEY_PATH" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"

          dmg_mount="$(mktemp -d "$RUNNER_TEMP/narrant-dmg-mount.XXXXXX")"
          dmg_device=""
          dmg_attached=0
          # 无论布局或盘内签名验证在哪一步失败，都尝试安全卸载只读镜像。
          detach_dmg() {
            local detach_target
            if (( dmg_attached == 0 )); then
              return
            fi
            detach_target="${dmg_device:-$dmg_mount}"
            hdiutil detach "$detach_target" || hdiutil detach -force "$detach_target"
            dmg_attached=0
          }
          trap detach_dmg EXIT
          attach_output="$(hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$dmg_mount")"
          dmg_attached=1
          dmg_device="$(awk '$1 ~ /^\/dev\// { device=$1 } END { print device }' <<< "$attach_output")"
          [[ -n "$dmg_device" ]] || {
            echo "最终 DMG 已挂载但无法识别设备。" >&2
            exit 1
          }
          mounted_apps=("$dmg_mount"/*.app)
          [[ ${#mounted_apps[@]} -eq 1 ]] || {
            echo "最终 DMG 卷根必须只包含唯一 Narrant.app。" >&2
            exit 1
          }
          [[ "$(basename "${mounted_apps[0]}")" == "Narrant.app" ]] || {
            echo "最终 DMG 卷根的唯一 app 必须命名为 Narrant.app。" >&2
            exit 1
          }
          [[ -L "$dmg_mount/Applications" && "$(readlink "$dmg_mount/Applications")" == "/Applications" ]] || {
            echo "最终 DMG 缺少指向 /Applications 的安装快捷方式。" >&2
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$dmg_mount/Narrant.app"
          xcrun stapler validate "$dmg_mount/Narrant.app"
          spctl --assess --type execute --verbose=4 "$dmg_mount/Narrant.app"
          detach_dmg
          trap - EXIT

          mkdir -p release-assets
          cp "$dmg_path" "release-assets/Narrant_${{ needs.validate.outputs.version }}_aarch64.dmg"
          cp "$updater_archive" release-assets/narrant-darwin-aarch64-updater.app.tar.gz
          cp "$updater_archive.sig" release-assets/narrant-darwin-aarch64-updater.app.tar.gz.sig
      - uses: actions/upload-artifact@v4
        with:
          name: narrant-macos-${{ needs.validate.outputs.version }}
          path: release-assets/*
          if-no-files-found: error

      - name: 恢复 CI 钥匙串并删除本次签名凭据
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, shlex, subprocess
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          previous = temporary / 'narrant-signing-keychains.txt'
          keychain = temporary / 'narrant-signing.keychain-db'
          try:
              if previous.exists():
                  subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(previous.read_text())], check=True)
          finally:
              try:
                  if keychain.exists():
                      subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
              finally:
                  (temporary / 'developer-id.p12').unlink(missing_ok=True)
                  (temporary / ('AuthKey_' + os.environ['APPLE_API_KEY'] + '.p8')).unlink(missing_ok=True)
          previous.unlink(missing_ok=True)
          PYTHON

  windows:
    needs: [validate, quality-gate]
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      NARRANT_GITHUB_CLIENT_ID: ${{ vars.NARRANT_GITHUB_CLIENT_ID }}
      NARRANT_GITHUB_APP_SLUG: ${{ vars.NARRANT_GITHUB_APP_SLUG }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      NARRANT_UPDATER_ENDPOINT: https://github.com/XLCYun/narrant/releases/latest/download/latest.json
      NARRANT_UPDATER_PUBLIC_KEY: ${{ vars.NARRANT_UPDATER_PUBLIC_KEY }}
      NARRANT_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.NARRANT_RELEASE_SIGNING_PUBLIC_KEY }}
      NARRANT_UPDATER_BRIDGE_TAG: ${{ vars.NARRANT_UPDATER_BRIDGE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 在构建前校验 updater trust 配置
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少 TAURI_SIGNING_PRIVATE_KEY"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "缺少 TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          }
          if ([string]::IsNullOrWhiteSpace($env:NARRANT_UPDATER_PUBLIC_KEY)) {
            throw "缺少 NARRANT_UPDATER_PUBLIC_KEY"
          }
          if ([string]::IsNullOrWhiteSpace($env:NARRANT_RELEASE_SIGNING_PUBLIC_KEY)) {
            throw "缺少 NARRANT_RELEASE_SIGNING_PUBLIC_KEY"
          }
          if (($env:NARRANT_RELEASE_SIGNING_PUBLIC_KEY -ne $env:NARRANT_UPDATER_PUBLIC_KEY) -and
              ($env:NARRANT_UPDATER_BRIDGE_TAG -ne $env:GITHUB_REF_NAME)) {
            throw "updater key bridge 缺少 exact tag 授权"
          }
          if ($env:NARRANT_UPDATER_ENDPOINT -ne "https://github.com/XLCYun/narrant/releases/latest/download/latest.json") {
            throw "NARRANT_UPDATER_ENDPOINT 必须是固定公开 Stable manifest。"
          }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ runner.os }}-native
      - run: pnpm install --frozen-lockfile
      - name: 构建带 updater 签名的 current-user Windows x64 NSIS
        run: pnpm build:windows
      - name: 收集 Windows 安装包、updater 包与签名
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          $signatures = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe.sig")
          if ($installers.Count -ne 1) {
            throw "期望一个 Windows x64 NSIS 安装包，实际找到 $($installers.Count) 个。"
          }
          if ($signatures.Count -ne 1) {
            throw "期望一个 Windows x64 updater 签名，实际找到 $($signatures.Count) 个。"
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $installers[0].FullName "release-assets/Narrant_${{ needs.validate.outputs.version }}_x64-setup.exe"
          Copy-Item $installers[0].FullName "release-assets/narrant-windows-x86_64-updater.exe"
          Copy-Item $signatures[0].FullName "release-assets/narrant-windows-x86_64-updater.exe.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: narrant-windows-${{ needs.validate.outputs.version }}
          path: release-assets/*
          if-no-files-found: error

  draft-release:
    permissions:
      contents: write
    needs: [validate, macos, windows]
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      public_release_id: ${{ steps.reconcile.outputs.release_id }}
      previous_stable_tag: ${{ steps.previous-stable.outputs.tag }}
      previous_stable_manifest_sha256: ${{ steps.previous-stable.outputs.manifest_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPOSITORY: XLCYun/narrant
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      NARRANT_UPDATER_PUBLIC_KEY: ${{ vars.NARRANT_UPDATER_PUBLIC_KEY }}
      NARRANT_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.NARRANT_RELEASE_SIGNING_PUBLIC_KEY }}
      NARRANT_UPDATER_BRIDGE_TAG: ${{ vars.NARRANT_UPDATER_BRIDGE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod
      - name: 在任何远端变更前固定当前 published Stable 身份
        id: previous-stable
        if: github.ref_name != vars.NARRANT_FIRST_UPDATER_TAG
        run: node scripts/release/read-public-stable-identity.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: narrant-*-${{ needs.validate.outputs.version }}
          path: release-assets
          merge-multiple: true
      - name: 生成公开 Release Notes
        run: node scripts/release/generate-public-release-notes.mjs "$RELEASE_TAG" release-notes.md
      - name: 在任何远端变更前生成并验证完整 Draft 资产
        run: node scripts/release/prepare-draft-assets.mjs release-assets release-notes.md
      - name: 创建或完整替换公开仓库 Draft 并 API 回读资产集合
        id: reconcile
        run: node scripts/release/reconcile-draft-release.mjs "$RELEASE_TAG" "$RELEASE_VERSION" release-notes.md release-assets/*

  update-smoke:
    needs: [validate, draft-release]
    uses: ./.github/workflows/update-smoke.yml
    with:
      source_tag: ${{ github.ref_name }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      public_release_id: ${{ needs.draft-release.outputs.public_release_id }}
      public_tag: ${{ github.ref_name }}
      mode: ${{ github.ref_name == vars.NARRANT_FIRST_UPDATER_TAG && 'bootstrap' || 'normal' }}
      previous_stable_tag: ${{ needs.draft-release.outputs.previous_stable_tag }}
      previous_stable_manifest_sha256: ${{ needs.draft-release.outputs.previous_stable_manifest_sha256 }}
