name: quality-gate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # Windows 库测试与集成测试需要 Common Controls v6，沿用现有构建入口。
      NARRANT_WINDOWS_TEST_MANIFEST: ${{ matrix.os == 'windows-2022' && '1' || '' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Rust 格式检查
        run: bash scripts/cargo-agent.sh fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust 静态检查
        run: bash scripts/cargo-agent.sh clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust 单元及集成测试
        run: bash scripts/cargo-agent.sh test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Rust 文档测试
        run: bash scripts/cargo-agent.sh test --locked --manifest-path src-tauri/Cargo.toml --doc

  typescript:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript Lint
        run: pnpm lint
      - name: TypeScript 类型检查与构建
        run: pnpm build
      - name: 前端单元及组件测试
        run: pnpm test
      - name: 工作流与工具脚本回归
        run: pnpm test:scripts

  windows-e2e:
    needs: [rust, typescript]
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: 运行全部真实 Tauri E2E
        run: pnpm test:e2e

  macos-e2e:
    needs: [rust, typescript]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: 运行全部真实 Tauri E2E
        run: pnpm test:e2e
