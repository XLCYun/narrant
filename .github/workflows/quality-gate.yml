name: quality-gate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ${{ fromJSON(vars.NARRANT_MACOS_RUNNER_LABELS || '["self-hosted","macOS","ARM64","narrant-ci"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 验证自托管编译环境
        run: node scripts/verify-macos-runner.mjs
      - name: Rust 格式检查
        run: bash scripts/cargo-agent.sh fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust 静态检查
        run: bash scripts/cargo-agent.sh clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust 单元、集成及文档测试
        run: |
          bash scripts/cargo-agent.sh test --manifest-path src-tauri/Cargo.toml --all-targets
          bash scripts/cargo-agent.sh test --manifest-path src-tauri/Cargo.toml --doc

  typescript:
    runs-on: ${{ fromJSON(vars.NARRANT_MACOS_RUNNER_LABELS || '["self-hosted","macOS","ARM64","narrant-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - name: TypeScript Lint
        run: pnpm lint
      - name: TypeScript 类型检查与构建
        run: pnpm build
      - name: 前端单元及组件测试
        run: pnpm test
      - name: 工作流与工具脚本回归
        run: pnpm test:scripts

  windows-e2e:
    needs: [rust, typescript]
    runs-on: ${{ fromJSON(vars.NARRANT_WINDOWS_RUNNER_LABELS || '["self-hosted","Windows","X64","narrant-ci"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 验证真实桌面会话
        run: node scripts/verify-desktop-runner.mjs
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: 运行全部真实 Tauri E2E
        run: pnpm test:e2e

  macos-e2e:
    needs: windows-e2e
    runs-on: ${{ fromJSON(vars.NARRANT_MACOS_RUNNER_LABELS || '["self-hosted","macOS","ARM64","narrant-ci"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 验证真实桌面会话
        run: node scripts/verify-desktop-runner.mjs
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: 运行全部真实 Tauri E2E
        run: pnpm test:e2e
