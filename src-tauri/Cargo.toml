[package]
name = "narrant"
version = "0.1.0"
description = "Narrant read-only change review"
authors = ["Narrant contributors"]
edition = "2021"

[lib]
name = "narrant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
