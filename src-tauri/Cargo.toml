[package]
name = "narrant"
version = "0.1.0"
description = "Narrant read-only change review"
authors = ["Narrant contributors"]
edition = "2021"

[lib]
name = "narrant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
git2 = { version = "0.19", features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
