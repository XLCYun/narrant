[package]
name = "narrant"
version = "1.1.1"
description = "Narrant read-only change review"
authors = ["Narrant contributors"]
edition = "2021"

[lib]
name = "narrant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
async-trait = "0.1"
http = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libc = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
octocrab = { version = "0.54.1", default-features = false, features = ["default-client", "jwt-rust-crypto", "rustls", "rustls-ring", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rig = { version = "0.42", default-features = false, features = ["agent"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "process"] }
tempfile = "3"
tauri-plugin-dialog = "2.7.2"
walkdir = "2"

[dev-dependencies]
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
httpmock = "0.7"
