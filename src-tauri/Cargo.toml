[package]
name = "narrant"
version = "1.2.14"
description = "Narrant read-only change review"
authors = ["Narrant contributors"]
edition = "2021"

[lib]
name = "narrant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
async-trait = "0.1"
http = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
globset = "0.4"
fs2 = "0.4"
libc = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
octocrab = { version = "0.54.1", default-features = false, features = ["default-client", "jwt-rust-crypto", "rustls", "rustls-ring", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
ra_ap_syntax = "=0.0.349"
oxc_allocator = "=0.150.0"
oxc_ast = "=0.150.0"
oxc_ast_visit = "=0.150.0"
oxc_parser = "=0.150.0"
oxc_span = "=0.150.0"
oxc_codegen = "=0.150.0"
oxc_semantic = "=0.150.0"
futures-util = "0.3"
flate2 = "1"
minisign-verify = "0.2"
rig = { version = "0.42", default-features = false, features = ["agent", "reqwest", "rustls"] }
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
secrecy = "0.10"
semver = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sys-locale = "0.3.2"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "=2.10.1", features = ["rustls-tls"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
tauri-plugin-dialog = "2.7.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
walkdir = "2"
url = "2"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
httpmock = "0.7"
tauri = { version = "2", features = ["test"] }
