[package]
name = "narrant"
version = "0.1.0"
description = "Narrant read-only change review"
authors = ["Narrant contributors"]
edition = "2021"

[lib]
name = "narrant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
git2 = { version = "0.19", features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
